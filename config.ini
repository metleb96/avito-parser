# Avito Parser Configuration File

[parser]
# Chrome settings
chrome_headless = false
chrome_version_auto = true
page_load_strategy = eager
min_scroll_delay = 0.5
max_scroll_delay = 1.5
min_page_delay = 3
max_page_delay = 6

# Parsing settings
default_max_pages = 5
output_file = avito_data.csv
csv_delimiter = ;

[processor]
input_file = avito_data.csv
output_file = cleaned_avito_data.csv

[vectorizer]
input_file = cleaned_avito_data.csv
output_file = vectorized_data.json
model_name = paraphrase-multilingual-MiniLM-L12-v2
batch_size = 32

[search]
top_k_results = 10
max_display_results = 50

[logging]
level = INFO
format = %(asctime)s - %(levelname)s - %(message)s
log_to_file = false
log_file = avito_parser.log

[gui]
window_width = 900
window_height = 700
theme = Dark
color_theme = blue
